name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  test:
    name: Test (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12", "3.13"]

    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}

      # The end-to-end tests start their own sshd on a loopback port; without
      # one they are skipped. Password tests need root and skip here.
      - name: Install OpenSSH server
        run: sudo apt-get update && sudo apt-get install -y openssh-server

      - name: Install test dependencies
        run: python -m pip install "paramiko>=3.5,<6" "pytest>=8,<10" "pyyaml>=6,<7"

      - name: Run tests
        run: python -m pytest tests

  hermes:
    name: Load in Hermes (plugins doctor)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          path: plugin

      - uses: actions/checkout@v6
        with:
          repository: NousResearch/hermes-agent
          path: hermes-agent

      - uses: astral-sh/setup-uv@v6

      - name: Install Hermes
        working-directory: hermes-agent
        run: |
          uv venv -p 3.11 .venv
          uv pip install -p .venv/bin/python -e . "paramiko>=3.5,<6"

      # `hermes plugins validate` is not run: its security scan rates every
      # mention of authorized_keys as critical, which ssh_authorize needs by
      # design (see README, Installation).
      - name: Doctor
        env:
          HERMES_HOME: ${{ runner.temp }}/hermes-home
        run: |
          mkdir -p "$HERMES_HOME"
          hermes-agent/.venv/bin/hermes plugins doctor plugin --ci
